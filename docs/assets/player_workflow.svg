<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#64748b" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #f1f5f9; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.5px; }
    .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .code { font-family: Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 11px; fill: #7dd3fc; }
  </style>

  <!-- Background -->
  <rect width="920" height="220" fill="#0f172a" rx="8" stroke="#1e293b" stroke-width="1"/>

  <!-- ==================== STEP 1 ==================== -->
  <g transform="translate(30, 25)">
    <rect width="250" height="170" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/>
    
    <!-- Top badge -->
    <rect x="15" y="15" width="60" height="20" fill="#1e3a5f" rx="3"/>
    <text x="24" y="29" class="badge" fill="#60a5fa">STEP 1</text>
    
    <text x="15" y="58" class="title">Connect European VPN</text>
    <text x="15" y="80" class="body">Connect ProtonVPN or another free VPN</text>
    <text x="15" y="98" class="body">to a European node (e.g. Netherlands).</text>
    
    <rect x="15" y="115" width="220" height="30" fill="#0f172a" stroke="#334155" stroke-width="1" rx="4"/>
    <text x="25" y="134" class="code">ProtonVPN: Connected [EU]</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 295 110 L 325 110" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ==================== STEP 2 ==================== -->
  <g transform="translate(335, 25)">
    <rect width="250" height="170" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/>
    
    <!-- Top badge -->
    <rect x="15" y="15" width="60" height="20" fill="#064e3b" rx="3"/>
    <text x="24" y="29" class="badge" fill="#34d399">STEP 2</text>
    
    <text x="15" y="58" class="title">Start WARP-MIN</text>
    <text x="15" y="80" class="body">Run in terminal (auto-requests UAC):</text>
    
    <rect x="15" y="95" width="220" height="30" fill="#0f172a" stroke="#334155" stroke-width="1" rx="4"/>
    <text x="25" y="114" class="code">warp-min.exe --tun</text>
    
    <text x="15" y="145" class="body">Probes Anycast edge and sets route.</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 600 110 L 630 110" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ==================== STEP 3 ==================== -->
  <g transform="translate(640, 25)">
    <rect width="250" height="170" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/>
    
    <!-- Top badge -->
    <rect x="15" y="15" width="60" height="20" fill="#3b0764" rx="3"/>
    <text x="24" y="29" class="badge" fill="#c084fc">STEP 3</text>
    
    <text x="15" y="58" class="title">Launch Roblox &amp; Play</text>
    <text x="15" y="80" class="body">Join any experience.</text>
    <text x="15" y="98" class="body">Press Shift+F3 for in-game Ping HUD.</text>
    
    <rect x="15" y="115" width="220" height="30" fill="#0f172a" stroke="#334155" stroke-width="1" rx="4"/>
    <text x="25" y="134" class="code">Low Ping HUD + Voice Active</text>
  </g>
</svg>
